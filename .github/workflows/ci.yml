name: Test Suite

on:
  push:
    paths:
      - "tests/**"
      - "l2-zk/**"
      - "l2-optimistic/**"
      - "l1/contracts/**"
      - "dashboard/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

# Cancel an in-progress run if a newer commit on the same branch arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "21 tests across unit, integration and adversarial tiers"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test runner image
        # All tests replace web3 and prometheus_client with MagicMock objects
        # at import time, so no Hardhat node or running stack is needed.
        # The test-runner image is the same image as the main service; pytest
        # simply overrides the CMD.
        run: docker compose build test-runner

      - name: Unit tests — ZK sequencer (5 tests)
        # Validates: batch threshold at 100 tx, 32-byte state root + non-empty
        # proof, TPS gauge accuracy, RPC failure isolation, metrics endpoint schema.
        run: |
          docker compose --profile test run --rm test-runner \
            pytest tests/unit/test_zk_sequencer.py -v --tb=short

      - name: Unit tests — Optimistic sequencer (5 tests)
        # Validates: batch threshold at 200 tx, absence of proof generation,
        # finality timestamp recording, polling interval, metrics endpoint schema.
        run: |
          docker compose --profile test run --rm test-runner \
            pytest tests/unit/test_optimistic_sequencer.py -v --tb=short

      - name: Integration tests — dual sequencer (7 tests)
        # Validates: side-by-side batch count ratio (2 ZK vs 1 Optimistic for
        # 200 tx), full pipeline, proof overhead difference (2 vs 1 SHA-256 call),
        # multi-batch slicing, finality model divergence, schema parity,
        # and metric isolation between sequencer instances.
        run: |
          docker compose --profile test run --rm test-runner \
            pytest tests/integration/ -v --tb=short

      - name: Adversarial tests — crash and recovery (4 tests)
        # Validates: RuntimeError propagation at ZK batch threshold,
        # clean state on sequencer restart, L1 congestion simulation (1.5s delay),
        # and malicious state root rejection vs challenge window behaviour.
        run: |
          docker compose --profile test run --rm test-runner \
            pytest tests/adversarial/ -v --tb=short

      - name: Clean up Docker network
        if: always()
        run: docker compose down
